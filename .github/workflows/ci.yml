name: CI

on:
  pull_request:
    # "labeled" so adding the `native` label starts the native parity jobs.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"
  TURBO_UI: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # turbo --affected needs history
      - uses: pnpm/action-setup@v6 # reads packageManager from package.json
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm turbo run typecheck test build --affected
      # check:packages packs every package, so they all need dist/ (cached by turbo).
      - run: pnpm build
      - run: pnpm check:packages

  changes:
    runs-on: ubuntu-latest
    outputs:
      # The native parity jobs take 15-50 minutes, so they only run when native code changed AND
      # the PR has the `native` label, the push is to main, or the head commit asks for
      # [update-baselines]. Skipped native jobs count as passing in parity-compare.
      native: ${{ steps.decide.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            native:
              - "packages/tokens/**"
              - "packages/core/**"
              - "packages/motion/**"
              - "packages/native/**"
              - "packages/ui/**"
              - "packages/demo-content/**"
              - "packages/parity/**"
              - "apps/mobile/**"
              - "pnpm-lock.yaml"
              - ".github/workflows/ci.yml"
      - id: decide
        env:
          CHANGED: ${{ steps.filter.outputs.native }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'native') }}
          ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          update=false
          git log -1 --format=%B | grep -qF "[update-baselines]" && update=true
          if [ "$CHANGED" = true ] && { [ "$LABELLED" = true ] || [ "$ON_MAIN" = true ] || [ "$update" = true ]; }; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi
          echo "native changed=$CHANGED label=$LABELLED main=$ON_MAIN update-baselines=$update"

  parity-web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unison-ui/parity exec playwright install --with-deps chromium webkit
      - run: pnpm test:parity --platform web --baseline-only
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-${{ github.job }}
          path: packages/parity/parity-output

  parity-ios:
    needs: [check, changes]
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    permissions:
      contents: write # commits generated baselines back in [update-baselines] mode
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Baseline mode
        # A head commit message containing [update-baselines] regenerates this platform's
        # baselines and commits them back (there's no macOS machine to do it locally).
        run: |
          if git log -1 --format=%B | grep -qF "[update-baselines]"; then
            echo "PARITY_FLAGS=--update" >> "$GITHUB_ENV"
          else
            echo "PARITY_FLAGS=--baseline-only" >> "$GITHUB_ENV"
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Boot the parity simulator (packages/parity/parity-devices.json)
        run: |
          NAME=$(node -p "require('./packages/parity/parity-devices.json').ios.name")
          TYPE=$(node -p "require('./packages/parity/parity-devices.json').ios.deviceType")
          UDID=$(xcrun simctl create "$NAME" "$TYPE")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "PARITY_IOS_DEVICE=$NAME" >> "$GITHUB_ENV"
      - run: pnpm build
      # Incremental Xcode builds: keep CocoaPods downloads and DerivedData between runs.
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/DerivedData
          key: ios-build-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}
          restore-keys: ios-build-
      - name: Release build on the simulator
        working-directory: apps/mobile
        run: npx expo run:ios --configuration Release --device "$PARITY_IOS_DEVICE" --no-bundler
      - run: pnpm test:parity --platform ios $PARITY_FLAGS
      - name: Commit generated baselines
        if: env.PARITY_FLAGS == '--update'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/parity/baselines/ios
          if git diff --cached --quiet; then echo "no baseline changes"; exit 0; fi
          git commit -m "test(parity): ios baselines from CI"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-${{ github.job }}
          path: packages/parity/parity-output
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: maestro-debug-ios
          path: ~/.maestro/tests

  parity-android:
    needs: [check, changes]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits generated baselines back in [update-baselines] mode
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Baseline mode
        # A head commit message containing [update-baselines] regenerates this platform's
        # baselines and commits them back (there's no macOS machine to do it locally).
        run: |
          if git log -1 --format=%B | grep -qF "[update-baselines]"; then
            echo "PARITY_FLAGS=--update" >> "$GITHUB_ENV"
          else
            echo "PARITY_FLAGS=--baseline-only" >> "$GITHUB_ENV"
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - run: pnpm build
      # Incremental Gradle builds between runs.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}
          restore-keys: gradle-
      # A cached, already-booted emulator snapshot (reactivecircus/android-emulator-runner README).
      # Emulator profile: packages/parity/parity-devices.json (android).
      - uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-google_apis-x86_64-pixel_7
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: unison-parity
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: unison-parity
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd apps/mobile && npx expo run:android --variant release --no-bundler
            pnpm test:parity --platform android $PARITY_FLAGS
      - name: Commit generated baselines
        if: env.PARITY_FLAGS == '--update'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/parity/baselines/android
          if git diff --cached --quiet; then echo "no baseline changes"; exit 0; fi
          git commit -m "test(parity): android baselines from CI"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-${{ github.job }}
          path: packages/parity/parity-output
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: maestro-debug-android
          path: ~/.maestro/tests

  parity-compare:
    needs: [parity-web, parity-ios, parity-android]
    # Runs when every parity job succeeded or was skipped (docs-only PRs skip the native ones).
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: parity-*
          path: packages/parity/parity-output
          merge-multiple: true
      - name: Cross-platform comparison and report
        working-directory: packages/parity
        run: |
          status=0
          pnpm exec tsx scripts/compare.ts --cross-only || status=$?
          pnpm exec tsx scripts/report.ts --cross-only
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-report
          path: packages/parity/parity-output/report.html
